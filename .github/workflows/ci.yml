name: CI

on:
  push:
    branches:
      - "codex/**"
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amazon_product_studio_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amazon_product_studio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_MODE: local
      NEXT_PUBLIC_APP_MODE: local
      DEFAULT_LOCAL_USER_ID: local-user
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amazon_product_studio_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/amazon_product_studio_ci
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-local-secret
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      MU_API_KEY: ""
      WEBHOOK_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      PROVIDER_PROXY_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: Apply migrations
        run: npx prisma migrate deploy --config prisma.config.ts

      - name: Stage 6.1 acceptance checks
        run: npm run test:stage-6-1

      - name: Stage 6.2 async auth checks
        run: npm run test:stage-6-2

      - name: Stage 7 result management checks
        run: npm run test:stage-7

      - name: Stage 7.1 upload checks
        run: npm run test:stage-7-1

      - name: Stage 7.2 remediation checks
        run: npm run test:stage-7-2

      - name: UI text checks
        run: npm run test:ui-text

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Stage 7.2.1 Playwright upload E2E
        run: npm run test:stage-7-2-1

      - name: Stage 8 final release E2E
        run: npm run test:stage-8

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            tmp/stage7-2-1-e2e/diagnostics/**
            tmp/stage8-final-e2e/diagnostics/**
            docs/stages/stage-7-2-1/ui-acceptance/*.png
            docs/stages/stage-8/ui-acceptance/*.png
